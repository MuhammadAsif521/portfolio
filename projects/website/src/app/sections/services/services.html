<section id="services" class="services" appSpySection aria-labelledby="services-title">
  <!-- Figma: 3D orange blobs floating over the textured band (decorative). -->
  <!-- Blobs: srcset/sizes mirror the clamp() widths in services.scss (left 10-18rem, top 6-10rem, right 12-24rem). -->
  <img class="services__blob services__blob--left" src="/assets/images/blob-320.webp" srcset="/assets/images/blob-160.webp 160w, /assets/images/blob-320.webp 320w, /assets/images/blob-480.webp 480w, /assets/images/blob.webp 640w" sizes="(min-width: 1600px) 18rem, calc(6rem + 12vw)" alt="Blob" width="640" height="639" loading="lazy" decoding="async" aria-hidden="true" />
  <img class="services__blob services__blob--top" src="/assets/images/blob-160.webp" srcset="/assets/images/blob-160.webp 160w, /assets/images/blob-320.webp 320w, /assets/images/blob-480.webp 480w, /assets/images/blob.webp 640w" sizes="(min-width: 1600px) 10rem, calc(4rem + 6vw)" alt="Blob" width="640" height="639" loading="lazy" decoding="async" aria-hidden="true" />
  <img class="services__blob services__blob--right" src="/assets/images/blob-320.webp" srcset="/assets/images/blob-160.webp 160w, /assets/images/blob-320.webp 320w, /assets/images/blob-480.webp 480w, /assets/images/blob.webp 640w" sizes="(min-width: 1600px) 24rem, (max-width: 533px) 12rem, calc(6rem + 18vw)" alt="Blob" width="640" height="639" loading="lazy" decoding="async" aria-hidden="true" />

  <div class="services__inner">
    <header class="services__heading">
      <h2 id="services-title" class="services__title" data-reveal>
        {{ content.eyebrow }} <span class="services__accent">{{ content.title }}</span>
      </h2>
      <p class="services__intro" data-reveal>{{ content.intro }}</p>
    </header>

    <div data-reveal>
      <app-carousel [items]="featured" [slide]="card" label="Services" [onDark]="true" />
    </div>

    <p class="mt-8 text-center" data-reveal>
      <a class="inline-block rounded-full border border-band-dark-border px-5 py-2.5 text-sm font-semibold text-band-dark-text no-underline transition-colors hover:border-primary hover:text-primary focus-visible:shadow-focus focus-visible:outline-none" routerLink="/services">{{ content.allLabel }}</a>
    </p>
  </div>
</section>

<ng-template #card let-item>
  <app-service-card [item]="item" />
</ng-template>
