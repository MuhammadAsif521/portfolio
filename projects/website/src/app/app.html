<!-- Toasts only ever come from user actions, so the toaster (ngx-sonner) loads once the page is idle. -->
@defer (on idle) {
  <ngx-sonner-toaster [position]="toaster.position" [duration]="toaster.duration" [closeButton]="toaster.closeButton"
    [richColors]="toaster.richColors" />
}
<app-site-header />
<main id="main" tabindex="-1">
  <router-outlet />
</main>
<!-- Server-rendered for SEO; its code (reactive forms, quick contact) loads when it scrolls near. -->
@defer (hydrate on viewport) {
  <app-site-footer />
}
<!--
  Cookie banner: client-only (a plain @defer renders nothing on the server), after hydration on idle.
  It is position: fixed, so showing it never shifts the layout.
-->
@defer (on idle) {
  <app-cookie-consent />
}
