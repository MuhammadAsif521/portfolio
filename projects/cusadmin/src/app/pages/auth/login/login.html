<app-auth-layout mode="login">
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="mb-7">
      <h1 class="mt-2 text-3xl font-semibold tracking-[-0.05em] text-heading">
        Admin <span class="text-primary">Login</span>
      </h1>
      <p class="mt-2 text-sm leading-6 text-muted">Sign in to manage your portfolio content and site settings.</p>
    </div>

    <div class="grid grid-cols-12 gap-2">
      @for (field of fields; track field.name) {
        <div [class]="field.colClass || 'col-span-12'">
          <app-dynamic-reactive-form [config]="field" [formGroup]="form" />
        </div>
      }
    </div>

    <app-loading-button buttonText="Login" type="submit" color="primary" radius="small" size="large"
      [loading]="isSubmitting()" [disabled]="isSubmitting()" customClass="w-full mt-2" />
  </form>
</app-auth-layout>
