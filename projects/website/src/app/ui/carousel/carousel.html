<div class="carousel" [class.carousel--centered]="centered()" role="region" aria-roledescription="carousel" [attr.aria-label]="label()">
  <!-- APG carousel pattern: a labelled region whose slides are "n of m" groups. Plain divs (not ul/li),
       since role="group" is not allowed on li; the arrows and dots sit outside the track. -->
  <div
    #track
    class="carousel__track"
    [class.carousel__track--draggable]="overflowing()"
    [class.carousel__track--dragging]="dragging()"
    [attr.tabindex]="overflowing() || !measured() ? 0 : -1"
    (keydown)="onKeydown($event)"
  >
    @for (item of items(); track $index; let i = $index) {
      <div class="carousel__slide" role="group" aria-roledescription="slide" [attr.aria-label]="(i + 1) + ' of ' + count()">
        <ng-container [ngTemplateOutlet]="slide()" [ngTemplateOutletContext]="{ $implicit: item, index: i }" />
      </div>
    }
  </div>

  <div class="carousel__nav" [class.carousel__nav--on-dark]="onDark()" [hidden]="!overflowing()">
    <!-- Arrows: large screens only (touch and trackpads swipe) -->
    <button
      type="button"
      class="carousel__arrow"
      aria-label="Previous slide"
      [disabled]="atStart()"
      (click)="step(-1)"
    >
      <i-lucide name="arrow-left" [size]="20" aria-hidden="true" />
    </button>

    <div class="carousel__dots" [class.carousel__dots--on-dark]="onDark()">
      @for (item of items(); track $index; let i = $index) {
        <button
          type="button"
          class="carousel__dot"
          [class.is-active]="active() === i"
          [attr.aria-label]="'Show slide ' + (i + 1) + ' of ' + count()"
          [attr.aria-current]="active() === i ? 'true' : null"
          (click)="goTo(i)"
        ></button>
      }
    </div>

    <button
      type="button"
      class="carousel__arrow"
      aria-label="Next slide"
      [disabled]="atEnd()"
      (click)="step(1)"
    >
      <i-lucide name="arrow-right" [size]="20" aria-hidden="true" />
    </button>
  </div>
</div>
