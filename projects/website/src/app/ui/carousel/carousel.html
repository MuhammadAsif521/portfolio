<div class="carousel" role="region" aria-roledescription="carousel" [attr.aria-label]="label()">
  <ul #track class="carousel__track" [class.carousel__track--dragging]="dragging()" tabindex="-1">
    @for (item of items(); track $index; let i = $index) {
      <li class="carousel__slide" role="group" aria-roledescription="slide" [attr.aria-label]="(i + 1) + ' of ' + count()">
        <ng-container [ngTemplateOutlet]="slide()" [ngTemplateOutletContext]="{ $implicit: item, index: i }" />
      </li>
    }
  </ul>

  <div class="carousel__dots" [class.carousel__dots--on-dark]="onDark()" [hidden]="!overflowing()">
    @for (item of items(); track $index; let i = $index) {
      <button
        type="button"
        class="carousel__dot"
        [class.is-active]="active() === i"
        [attr.aria-label]="'Show slide ' + (i + 1) + ' of ' + count()"
        [attr.aria-current]="active() === i ? 'true' : null"
        (click)="goTo(i)"
      ></button>
    }
  </div>
</div>
