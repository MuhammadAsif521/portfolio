@if (visible()) {
<div @slideUp class="fixed bottom-0 left-0 right-0 z-[9999] p-3 sm:p-5" role="dialog" aria-modal="true"
    aria-label="Cookie preferences">
    <div class="max-w-3xl mx-auto rounded-md bg-card border border-border shadow-card overflow-hidden">


        <div class="p-4 sm:p-5">

            <!-- ── Header ── -->
            <div class="flex items-start gap-3 mb-4">

                <!-- Icon badge -->
                <div
                    class="shrink-0 w-9 h-9 rounded-sm bg-secondary/10 border border-secondary/20 flex items-center justify-center">
                    <i-lucide name="cookie" [size]="16" color="secondary" />
                </div>

                <!-- Text -->
                <div class="flex-1 min-w-0">
                    <p class="text-md font-semibold text-default leading-snug">
                        We value your privacy
                    </p>
                    <p class="text-md text-text-secondary mt-0.5 leading-relaxed">
                        NB Youth Prevention uses cookies to enhance browsing, analyze traffic, and
                        personalize your experience. See our
                        <a routerLink="/privacy-policy" class="text-secondary underline-offset-2 cursor-pointer">Privacy
                            Policy</a>
                        and
                        <a routerLink="/terms-conditions" class="text-secondary underline-offset-2 cursor-pointer">Terms &amp;
                            Conditions</a>.
                    </p>
                </div>
            </div>

            <!-- ── Actions ── -->
            <div class="flex flex-wrap items-center gap-2">

                <button (click)="acceptAll()"
                    class="inline-flex items-center gap-1.5 px-4 py-2 rounded-sm bg-secondary text-on-secondary text-xs font-semibold hover:bg-[var(--secondary)] transition-colors duration-base">
                    Accept All
                </button>

                <button (click)="rejectAll()"
                    class="inline-flex items-center gap-1.5 px-4 py-2 rounded-sm border border-border text-text-secondary text-xs font-medium hover:border-border/60 hover:text-default transition-colors duration-base">
                    Reject All
                </button>

            </div>

        </div>
    </div>
</div>
}
