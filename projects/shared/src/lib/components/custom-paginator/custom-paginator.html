<div class="flex flex-col items-center justify-between gap-4 font-body sm:flex-row">
  <div class="flex items-center gap-3 text-sm text-form-label-muted">
    <span>Showing
      <span class="font-semibold text-form-label">{{ rangeStart }}–{{ rangeEnd }}</span>
      of
      <span class="font-semibold text-form-label">{{ pagination?.totalItems ?? 0 }}</span>
      items</span>
    @if (showPageSize) {
    <app-custom-dropdown controlName="pageSize" [showLabel]="false" [options]="resolvedPageSizeOptions"
      [value]="pagination?.pageSize?.toString()" (changedOuput)="onPageSizeChange($event)"></app-custom-dropdown>
    }
  </div>
  <div class="flex flex-wrap items-center justify-center gap-2">
    <button (click)="goToPage(1)" [disabled]="pagination?.currentPage === 1" class="pager-btn">
      <i-lucide name="chevrons-left" [size]="16"></i-lucide>
    </button>
    <button (click)="goToPage((pagination?.currentPage ?? 1) - 1)" [disabled]="pagination?.currentPage === 1"
      class="pager-btn">
      <i-lucide name="chevron-left" [size]="16"></i-lucide>
    </button>
    @for (page of pageNumbers; track $index) { @if (page === '...') {
    <span class="flex h-9 w-9 select-none items-center justify-center text-sm text-form-label-muted">
      …
    </span>
    } @else {
    <button (click)="goToPage(+page)" [class]="getPageClass(+page)">
      {{ page }}
    </button>
    } }
    <button (click)="goToPage((pagination?.currentPage ?? 1) + 1)"
      [disabled]="pagination?.currentPage === pagination?.totalPages" class="pager-btn">
      <i-lucide name="chevron-right" [size]="16"></i-lucide>
    </button>
    <button (click)="goToPage(pagination?.totalPages ?? 1)"
      [disabled]="pagination?.currentPage === pagination?.totalPages" class="pager-btn">
      <i-lucide name="chevrons-right" [size]="16"></i-lucide>
    </button>
  </div>
</div>
