@let p = project();
<article class="project-card" [attr.aria-labelledby]="'project-' + p.slug">
  @if (p.coverImage; as cover) {
    <img
      class="project-card__image"
      [src]="cover.url"
      [alt]="cover.alt"
      [attr.width]="cover.width ?? 1266"
      [attr.height]="cover.height ?? 742"
      [attr.loading]="eager() ? null : 'lazy'"
      decoding="async"
      draggable="false"
    />
  } @else {
    <div class="project-card__placeholder" aria-hidden="true"></div>
  }

  <!-- Default: title over the image. Hover/focus: frosted panel with the summary. -->
  <div class="project-card__panel">
    @switch (headingLevel()) {
      @case (2) {
        <h2 class="project-card__title" [id]="'project-' + p.slug">{{ p.title }}</h2>
      }
      @case (4) {
        <h4 class="project-card__title" [id]="'project-' + p.slug">{{ p.title }}</h4>
      }
      @default {
        <h3 class="project-card__title" [id]="'project-' + p.slug">{{ p.title }}</h3>
      }
    }
    <p class="project-card__summary">{{ p.summary }}</p>
  </div>

  <!-- One link covering the card (stretched via ::after) keeps a single tab stop per project. -->
  <a class="project-card__link" [routerLink]="link()" draggable="false">
    <span class="sr-only">Read the {{ p.title }} case study</span>
    <span class="project-card__arrow" aria-hidden="true"><i-lucide name="arrow-right" [size]="28" /></span>
  </a>
</article>
