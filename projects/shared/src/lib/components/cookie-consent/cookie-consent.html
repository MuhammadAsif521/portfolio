@if (consentService.bannerVisible()) {
<div role="dialog" aria-live="polite" aria-label="Cookie consent"
    class="fixed bottom-0 left-0 right-0 z-[9999] px-4 pb-4 sm:px-6 sm:pb-6 md:left-auto md:right-6 md:max-w-sm">
    <div class="rounded-2xl border border-border bg-bg-surface shadow-xl p-5 flex flex-col gap-4">
        <!-- Icon + heading -->
        <div class="flex items-start gap-3">
            <span class="text-2xl" aria-hidden="true">🍪</span>
            <div>
                <h3 class="font-display text-base font-bold text-primary">We use cookies</h3>
                <p class="mt-1 font-body text-xs text-text-muted leading-relaxed">
                    We use cookies to improve your experience, remember your preferences, and analyse traffic.
                    By clicking <strong>Accept</strong> you agree to our use of cookies.
                    <a [routerLink]="privacyPolicyPath" class="font-bold text-secondary hover:underline ml-1"
                        (click)="consentService.acceptAll()">
                        Privacy Policy
                    </a>
                </p>
            </div>
        </div>

        <!-- Actions -->
        <div class="flex flex-wrap gap-2">
            <button type="button" (click)="consentService.acceptAll()"
                class="flex-1 rounded-xl bg-primary px-4 py-2.5 font-body text-sm font-bold text-on-primary transition hover:opacity-90 active:scale-95">
                Accept All
            </button>
            <button type="button" (click)="consentService.rejectNonEssential()"
                class="flex-1 rounded-xl border border-border bg-transparent px-4 py-2.5 font-body text-sm font-bold text-text-muted transition hover:bg-bg-muted active:scale-95">
                Essential Only
            </button>
        </div>

        <button type="button" (click)="consentService.openPreferences()"
            class="font-body text-xs font-bold text-text-muted underline underline-offset-2 transition hover:text-primary self-center">
            Manage Preferences
        </button>
    </div>
</div>
}
