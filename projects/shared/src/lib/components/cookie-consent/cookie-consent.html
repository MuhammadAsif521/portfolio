@if (consent.bannerVisible()) {
<section #panel class="consent" role="region" aria-labelledby="consent-title" aria-describedby="consent-text" tabindex="-1">
  <h2 id="consent-title" class="consent__title">Analytics cookies</h2>
  <p id="consent-text" class="consent__text">
    May I use Google Analytics cookies to see which pages are read? No ads, and nothing is set unless you
    accept. You can change this any time under "Cookie settings".
    <a class="consent__link" [routerLink]="policyPath()">Cookie policy</a>
  </p>
  <div class="consent__actions">
    <button type="button" class="consent__btn consent__btn--accept" (click)="accept()">Accept analytics</button>
    <button type="button" class="consent__btn consent__btn--reject" (click)="reject()">Reject</button>
  </div>
</section>
}
