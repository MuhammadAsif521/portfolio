@let p = post();
<article class="post-card">
  <div class="post-card__media">
    <div class="post-card__frame">
      @if (p.coverImage; as cover) {
        <img
          class="post-card__image"
          [src]="cover.url"
          [alt]="cover.alt"
          [attr.width]="cover.width ?? 832"
          [attr.height]="cover.height ?? 862"
          loading="lazy"
          decoding="async"
        />
      } @else {
        <div class="post-card__placeholder" aria-hidden="true">
          <i-lucide name="pen-line" [size]="44" />
        </div>
      }
    </div>
    <!-- Navy circle in the notch (Figma); the card's title link is the real target. -->
    <span class="post-card__arrow" aria-hidden="true"><i-lucide name="arrow-up-right" [size]="40" [stroke]="2.5" /></span>
  </div>

  <div class="post-card__body">
    @if (tag(); as t) {
      <p class="post-card__tag">{{ t }}</p>
    }
    <p class="post-card__meta">
      <span class="post-card__dot">{{ author() }}</span>
      @if (date(); as d) {
        <time class="post-card__dot" [attr.datetime]="d.iso">{{ d.label }}</time>
      }
    </p>
    @if (headingLevel() === 2) {
      <h2 class="post-card__title"><a class="post-card__link" [routerLink]="link()">{{ p.title }}</a></h2>
    } @else {
      <h3 class="post-card__title"><a class="post-card__link" [routerLink]="link()">{{ p.title }}</a></h3>
    }
  </div>
</article>
