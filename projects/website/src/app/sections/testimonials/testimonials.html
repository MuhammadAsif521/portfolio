@if (items().length) {
  <section id="testimonials" class="testimonials" aria-labelledby="testimonials-title">
    <!-- Figma sparkles (decorative) -->
    <svg class="testimonials__sparkle testimonials__sparkle--left" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5c.6 5.2 2.5 8 9.5 10.5-7 2.5-8.9 5.3-9.5 10.5-.6-5.2-2.5-8-9.5-10.5 7-2.5 8.9-5.3 9.5-10.5Z" /></svg>
    <svg class="testimonials__sparkle testimonials__sparkle--right" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5c.6 5.2 2.5 8 9.5 10.5-7 2.5-8.9 5.3-9.5 10.5-.6-5.2-2.5-8-9.5-10.5 7-2.5 8.9-5.3 9.5-10.5Z" /></svg>

    <header class="testimonials__heading">
      <h2 id="testimonials-title" class="testimonials__title" data-reveal>
        <span class="testimonials__line">
          {{ content.title }}
          <svg class="testimonials__doodle" viewBox="0 0 36 36" aria-hidden="true">
            <path d="M8 20 L3 4 M16 22 L22 3 M22 27 L33 19" />
          </svg>
        </span>
        <span class="testimonials__line">{{ content.lead }} <span class="testimonials__accent">{{ content.accent }}</span></span>
      </h2>
      <p class="testimonials__intro" data-reveal>{{ content.intro }}</p>
    </header>

    <div class="testimonials__carousel" data-reveal>
      <app-carousel [items]="items()" [slide]="card" label="Testimonials" [onDark]="true" [centered]="true" />
    </div>
  </section>
}

<ng-template #card let-t>
  <figure class="quote-card">
    <svg class="quote-card__mark" viewBox="0 0 110 90" aria-hidden="true">
      <path
        d="M0 0h46v44C46 70 34 86 12 90l-4-10c11-4 17-12 17-26H0V0Zm64 0h46v44c0 26-12 42-34 46l-4-10c11-4 17-12 17-26H64V0Z"
      />
    </svg>

    <figcaption class="quote-card__person">
      <span class="quote-card__avatar" aria-hidden="true">{{ initials(t.name) }}</span>
      <span class="quote-card__who">
        <span class="quote-card__name">{{ t.name }}</span>
        @if (t.role || t.company) {
          <span class="quote-card__role">{{ t.role }}{{ t.role && t.company ? ', ' : '' }}{{ t.company }}</span>
        }
      </span>
    </figcaption>

    @if (t.rating) {
      <p class="quote-card__rating" [attr.aria-label]="t.rating + ' out of 5 stars'">
        @for (star of stars; track star) {
          <i-lucide
            name="star"
            [size]="26"
            [stroke]="0"
            [fill]="star <= t.rating ? 'currentColor' : 'none'"
            [class.is-off]="star > t.rating"
            aria-hidden="true"
          />
        }
        <span class="quote-card__score" aria-hidden="true">{{ t.rating }}.0</span>
      </p>
    }

    <blockquote class="quote-card__quote">
      <p>{{ t.quote }}</p>
    </blockquote>

    @if (t.sourceUrl) {
      <a class="quote-card__source" [href]="t.sourceUrl" target="_blank" rel="noopener noreferrer nofollow" draggable="false">
        View on {{ sourceLabel(t.source) }}
        <i-lucide name="arrow-up-right" [size]="14" aria-hidden="true" />
        <span class="sr-only">(opens in a new tab)</span>
      </a>
    }
  </figure>
</ng-template>
