<mat-dialog-content class="!p-0 dialog-content">
  <div class="flex items-center justify-between border-b border-border px-6 py-4">
    <h2 class="text-lg font-semibold text-heading">{{ data.title }}</h2>
    <button type="button" (click)="close()" [disabled]="saving()" aria-label="Close"
      class="rounded-full p-2 text-error hover:bg-surface-muted disabled:pointer-events-none disabled:opacity-50">
      <i-lucide name="x" [size]="18" />
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="max-h-[64vh] overflow-y-auto px-6 py-5">
      <div class="grid grid-cols-12 items-center gap-2">
        @for (field of fields; track field.name) {
          <div [class]="field.colClass || 'col-span-12'">
            <app-dynamic-reactive-form [config]="field" [formGroup]="form" />
          </div>
        }
      </div>
    </div>

    <div class="flex items-center justify-end gap-3 border-t border-border px-6 py-4">
      <app-loading-button buttonText="Cancel" color="neutral" radius="small" size="medium" (click)="close()"
        [disabled]="saving()" />
      <app-loading-button [buttonText]="data.submitLabel || 'Save'" type="submit" color="primary" radius="small"
        size="medium" [loading]="saving()" [disabled]="saving()" />
    </div>
  </form>
</mat-dialog-content>
