<section id="services" class="services" appSpySection aria-labelledby="services-title">
  <!-- Figma: 3D orange blobs floating over the textured band (decorative). -->
  <!-- Blobs: srcset/sizes mirror the clamp() widths in services.scss (left 10-18rem, top 6-10rem, right 12-24rem). -->
  <img class="services__blob services__blob--left" src="/assets/images/blob-320.webp" srcset="/assets/images/blob-160.webp 160w, /assets/images/blob-320.webp 320w, /assets/images/blob-480.webp 480w, /assets/images/blob.webp 640w" sizes="(min-width: 1600px) 18rem, calc(6rem + 12vw)" alt="" width="640" height="639" loading="lazy" decoding="async" aria-hidden="true" />
  <img class="services__blob services__blob--top" src="/assets/images/blob-160.webp" srcset="/assets/images/blob-160.webp 160w, /assets/images/blob-320.webp 320w, /assets/images/blob-480.webp 480w, /assets/images/blob.webp 640w" sizes="(min-width: 1600px) 10rem, calc(4rem + 6vw)" alt="" width="640" height="639" loading="lazy" decoding="async" aria-hidden="true" />
  <img class="services__blob services__blob--right" src="/assets/images/blob-320.webp" srcset="/assets/images/blob-160.webp 160w, /assets/images/blob-320.webp 320w, /assets/images/blob-480.webp 480w, /assets/images/blob.webp 640w" sizes="(min-width: 1600px) 24rem, (max-width: 533px) 12rem, calc(6rem + 18vw)" alt="" width="640" height="639" loading="lazy" decoding="async" aria-hidden="true" />

  <div class="services__inner">
    <header class="services__heading">
      <h2 id="services-title" class="services__title" data-reveal>
        {{ content.eyebrow }} <span class="services__accent">{{ content.title }}</span>
      </h2>
      <p class="services__intro" data-reveal>{{ content.intro }}</p>
    </header>

    <div data-reveal>
      <app-carousel [items]="content.items" [slide]="card" label="Services" [onDark]="true" />
    </div>
  </div>
</section>

<ng-template #card let-item>
  <article class="service-card">
    <h3 class="service-card__title">{{ item.title }}</h3>

    <div class="service-card__media">
      <span class="service-card__layer service-card__layer--back" aria-hidden="true"></span>
      <span class="service-card__layer service-card__layer--mid" aria-hidden="true"></span>

      <div class="service-card__screen">
        @if (item.image; as image) {
          <img
            class="service-card__image"
            [src]="image.src"
            [alt]="image.alt"
            [width]="image.width"
            [height]="image.height"
            loading="lazy"
            decoding="async"
            draggable="false"
          />
        } @else {
          <!-- UI-style panel built from the service's own content until artwork exists. -->
          <div class="service-card__ui">
            <span class="service-card__icon" aria-hidden="true"><i-lucide [name]="item.icon" [size]="26" /></span>
            <p class="service-card__summary">{{ item.summary }}</p>
            <ul class="service-card__points" aria-label="Includes">
              @for (point of item.points; track point) {
                <li class="service-card__chip">{{ point }}</li>
              }
            </ul>
          </div>
        }
      </div>

      <!-- Decorative badge in the notch (Figma's navy circle). Not a link: services have no page of their own. -->
      <span class="service-card__badge" aria-hidden="true">
        <i-lucide [name]="item.icon" [size]="36" [stroke]="2" />
      </span>
    </div>
  </article>
</ng-template>
